name: desktop-widget mac build

# 릴리스 태그에 맞는 위젯을 맥용 dmg/zip으로 빌드해서 같은 릴리스에 올린다.
#   desktop-widget-v*  → desktop-widget (화캉스 위젯)
#   gongcance-v*       → desktop-widget-gongcance (공캉스 위젯)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      widget:
        description: "빌드할 폴더"
        required: true
        default: desktop-widget
        type: choice
        options: [desktop-widget, desktop-widget-gongcance]

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - id: pick
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then DIR="${{ inputs.widget }}"
          elif [[ "$TAG" == desktop-widget-v* ]]; then DIR=desktop-widget
          elif [[ "$TAG" == gongcance-v* ]]; then DIR=desktop-widget-gongcance
          else DIR=""; fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - if: steps.pick.outputs.dir != ''
        uses: actions/checkout@v4
      - if: steps.pick.outputs.dir != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.pick.outputs.dir != ''
        working-directory: ${{ steps.pick.outputs.dir }}
        run: npm ci && npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: steps.pick.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pick.outputs.dir }}-mac
          path: |
            ${{ steps.pick.outputs.dir }}/dist/*.dmg
            ${{ steps.pick.outputs.dir }}/dist/*.zip
      - if: steps.pick.outputs.dir != '' && github.event_name == 'release'
        working-directory: ${{ steps.pick.outputs.dir }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.dmg dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
